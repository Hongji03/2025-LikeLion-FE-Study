<!DOCTYPE html>
<html lang="ko">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../src/css/layout1style.css">
    <title>Frame 27</title>
</head>
<body>
    <div id="wrap">
        <header>
            <div class="logo"></div>
            <div class="nav"></div>
        </header>
        <main>
            <div class="main_left">
                <img class="img_thumbnail" src="../src/img/layout1left.png" alt="main_left">
            </div>
            <div class="main_middle">
                <img class="img_thumbnail" src="../src/img/layout1middle.png" alt="main_middle">
            </div>
            <div class="main_right">
                <img class="img_thumbnail" src="../src/img/layout1right.png" alt="main_right">
            </div>
        </main>
        <footer>
            <div class="footer_left"></div>
            <div class="footer_right">
                <div class="right_top"></div>
                <div class="right_bottom"></div>
            </div>
        </footer>
    </div>
