<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../src/css/layout2style.css">
    <title>Frame 30</title>
</head>
<body>
    <div id="wrap">
        <header>
            <div class="logo"></div>
            <div class="nav"></div>
        </header>
        <main>
            <div class="section1">
                <div class="section1_top">
                    <div class="top_left">
                        <img class="img_thumbnail" src="../src/img/layout2section1topleft.png" alt="layout2section1topleft"> 
                    </div>
                    <div class="top_right">
                        <div class="right_top">
                            <img class="img_thumbnail" src="../src/img/layout2section1toprighttop.png" alt="layout2section1toprighttop">
                        </div>
                        <div class="right_bottom">
                            <img class="img_thumbnail" src="../src/img/layout2section1toprightbottom.png" alt="layout2section1toprightbottom">
                        </div>
                    </div>
                </div>
                <div class="section1_bottom">
                    <img class="img_thumbnail" src="../src/img/layout2section1bottom.png" alt="layout2section1bottom"> 
                </div>
            </div>
            <div class="section2">
                <img class="img_thumbnail" src="../src/img/layout2section2.png" alt="layout2section2">
            </div>
        </main>
        <footer>
            <div class="footer_left"></div>
            <div class="footer_middle"></div>
            <div class="footer_right"></div>
        </footer>
    </div>
</body>
</html>
