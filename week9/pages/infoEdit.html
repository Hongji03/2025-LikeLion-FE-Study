<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/section/infoEdit.css">
    <title>Homepage</title>
</head>
<body>
    <div id="wrap" class="container">
        <div class="top_bar">
            <div class="back_btn">
                <img src="../assets/img/svg/ic_back.svg" alt="ic_back">
            </div>
            <h3>Contact info</h3>
        </div>
        <div class="edit_profile">
            <img src="../assets/img/svg/ic_edit.svg" alt="ic_edit">
        </div>
        <div class="input_area">
            <div class="title">Name</div>
            <div class="input">
                <div class="text">Warren Buffet</div>
                <div class="change_btn">Change</div>
            </div>
        </div>
        <div class="input_area">
            <div class="title">Birthdate</div>
            <div class="input">
                <div class="text">05 November 1993</div>
                <div class="change_btn">Change</div>
            </div>
        </div>
        <div class="input_area">
            <div class="title">Gender</div>
            <div class="input">
                <div class="text">Male</div>
                <div class="change_btn">Change</div>
            </div>
        </div>
        <div class="input_area">
            <div class="title">Email</div>
            <div class="input">
                <div class="text">warren.buff@invest.ai</div>
                <div class="change_btn">Change</div>
            </div>
        </div>
        <div class="phone">
            <div class="title">Phone Nember</div>
            <div class="text">-</div>
        </div>
        <div class="address">
            <div class="title">Address</div>
            <div class="text">-</div>
        </div>
    </div>
</body>
</html>
