<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/section/projuct.css">
    <title>Product</title>
</head>
<body>
    <div id="wrap" class="container">
        <div class="big_modal">
            <div class="top_modal">
                <div class="top_bar">
                    <h3>My Asset</h3>
                    <img src="../assets/img/svg/ic_close.svg" alt="ic_close">
                </div>
                <div class="portfolio">
                    <p>Your total asset portfolio</p>
                    <div class="portfolio_bottom">
                        <div class="number">N203,935</div>
                        <img src="../assets/img/svg/ic_up_arrow.svg" alt="ic_up_arrow">
                        <p>+2%</p>
                    </div>
                </div>
                <div class="current">
                    <h3>Current Plans</h3>
                    <div class="gold">
                        <div class="text">Gold</div>
                        <div class="return">30% return</div>
                    </div>
                    <div class="all_btn">See All Plans →</div>
                </div>
                <div class="history">
                    <h3>History</h3>
                    <div class="history_item">
                        <div class="rp">Rp 200.000</div>
                        <div class="item_bottom">
                            <div class="buy">Buy "APPL" Stock</div>
                            <div class="date">TUE 22 Jun 2020</div>
                        </div>
                    </div>
                    <div class="history_item sell">
                        <div class="rp">Rp 150.000</div>
                        <div class="item_bottom">
                            <div class="buy">Sell "TLKM" Stock</div>
                            <div class="date">TUE 22 Jun 2020</div>
                        </div>
                    </div>
                    <div class="history_item">
                        <div class="rp">Rp 1000.240</div>
                        <div class="item_bottom">
                            <div class="buy">Buy "FB" Stock</div>
                            <div class="date">TUE 22 Jun 2020</div>
                        </div>
                    </div>
                    <div class="history_item sell">
                        <div class="rp">Rp 1000.240</div>
                        <div class="item_bottom">
                            <div class="buy">Sell "APPL" Stock</div>
                            <div class="date">TUE 22 Jun 2020</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
