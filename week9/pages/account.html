<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/section/account.css">
    <title>Account</title>
</head>
<body>
    <div id="wrap" class="container">
        <div class="back_btn">
            <img src="../assets/img/svg/ic_back.svg" alt="ic_back">
        </div>
        <h2>Profile</h2>
        <div class="user_info">
            <img src="../assets/img/png/user_img.png" alt="user_img">
            <div class="name">Jonas Macroni</div>
            <div class="job">Expert</div>
        </div>
        <div class="settings">
            <div class="setting_item">
                <div class="item_left">
                    <img class="icon" src="../assets/img/svg/ic_contact.svg" alt="ic_contact">
                    <div class="item_text">Contact Info</div>
                </div>
                <img class="arrow" src="../assets/img/svg/ic_right_arrow.svg" alt="ic_right_arrow">
            </div>
            <div class="setting_item">
                <div class="item_left">
                    <img class="icon" src="../assets/img/svg/ic_funding.svg" alt="ic_funding">
                    <div class="item_text">Source of Funding Info</div>
                </div>
                <img class="arrow" src="../assets/img/svg/ic_right_arrow.svg" alt="ic_right_arrow">
            </div>
            <div class="setting_item">
                <div class="item_left">
                    <img class="icon" src="../assets/img/svg/ic_bank.svg" alt="ic_bank">
                    <div class="item_text">Bank Account Info</div>
                </div>
                <img class="arrow" src="../assets/img/svg/ic_right_arrow.svg" alt="ic_right_arrow">
            </div>
            <div class="setting_item">
                <div class="item_left">
                    <img class="icon" src="../assets/img/svg/ic_doc.svg" alt="ic_doc">
                    <div class="item_text">Document Info</div>
                </div>
                <img class="arrow" src="../assets/img/svg/ic_right_arrow.svg" alt="ic_right_arrow">
            </div>
            <div class="setting_item">
                <div class="item_left">
                    <img class="icon" src="../assets/img/svg/ic_setting.svg" alt="ic_setting">
                    <div class="item_text">Settings</div>
                </div>
                <img class="arrow" src="../assets/img/svg/ic_right_arrow.svg" alt="ic_right_arrow">
            </div>
        </div>
    </div>
    <div class="btm_nav">
        <div class="unselect_nav">
            <img src="../assets/img/svg/ic_home_unselect.svg" alt="ic_home_unselect">
            <div class="nav_name">Home</div>
        </div>
        <div class="unselect_nav">
            <img src="../assets/img/svg/ic_search.svg" alt="ic_search">
            <div class="nav_name">Product</div>
        </div>
        <div class="unselect_nav">
            <img src="../assets/img/svg/ic_transaction.svg" alt="ic_transaction">
            <div class="nav_name">Transaction</div>
        </div>
        <div class="select_nav">
            <img src="../assets/img/svg/ic_user_select.svg" alt="ic_profile">
            <div class="nav_name">Account</div>
        </div>
    </div>
</body>
</html>
