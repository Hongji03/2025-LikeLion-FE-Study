<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../src/css/todolist.css">
    <title>TO-DO LIST</title>
</head>

<body>
    <div id="wrap">
        <header>
            <div class="title">TO-DO LIST</div>
            <div class="add">
                <input class="text" placeholder="오늘 할 일을 입력해주세요!" />
                <button id="add_btn">
                    <img class="plus" src="../src/img/todo_plus.svg" alt="todo_plus">
            </div>
            </button>

        </header>
        <main id="main">
            <div class="list">
                <div class="todo_item">
                    <div>
                        <input type="checkbox" id="check">
                        <label for="check"></label>
                        <p>코딩 공부하기</p>
                    </div>
                    <button id="delete">
                        <img class="plus" src="../src/img/todo_delete.svg" alt="todo_delete">
                </div>
                </button>
            </div>
    </div>
    </main>
    </div>
</body>

</html>
